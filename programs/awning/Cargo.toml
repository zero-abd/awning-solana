[package]
name = "awning"
version = "0.1.0"
description = "Awning on Solana: parametric cover bought by an AI agent under on-chain spending limits"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "awning"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022"] }

[dev-dependencies]
solana-program-test = "~2.2"
solana-sdk = "~2.2"
spl-token = { version = "7", features = ["no-entrypoint"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
